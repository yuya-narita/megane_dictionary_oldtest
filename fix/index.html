<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050403">
  <title>H(x)∞ origin｜世界バグ報告書</title>
  <link rel="stylesheet" href="./style.css?v=3">
</head>
<body class="shelf-mode">
<main>
  <section id="shelf" class="screen shelf">
    <div class="shelf-atmosphere" aria-hidden="true"></div>

    <div class="launcher">
      <img
        class="series-logo"
        src="./images/logo.svg"
        alt="H(x)∞ origin"
      >

      <p class="shelf-copy"></p>

      <button id="continueButton" class="continue-panel" hidden>
        <span class="continue-kicker">RESUME REPORT</span>
        <span class="continue-label">つづきから</span>
        <span id="continueMeta" class="continue-meta"></span>
      </button>

      <div class="archive-label">
        <span>WORLD BUG REPORTS</span>
        <i></i>
      </div>

      <div id="episodeList" class="episode-list"></div>

      <div class="launcher-footer">
        <span class="launcher-dot"></span>
        <small>ACCESS REPORT</small>
      </div>
    </div>
  </section>

  <section id="cover" class="screen cover" hidden>
    <div class="cover-atmosphere" aria-hidden="true"></div>

    <button id="coverBack" class="cover-back" aria-label="報告書一覧へ">
      <span aria-hidden="true">←</span>
      <span>ARCHIVE</span>
    </button>

    <div class="cover-panel">
      <img
        class="cover-series-logo"
        src="./images/logo.svg"
        alt="H(x)∞ origin"
      >

      <div class="cover-divider"></div>

      <p id="episodeNumber">PROLOGUE</p>
      <h2 id="episodeTitle"></h2>

      <button id="start" class="start-button">
        <span class="button-kicker">OPEN REPORT</span>
        <span>はじめる</span>
      </button>

      <button id="resumeFromCover" class="resume-button" hidden>
        <span class="button-kicker">RESUME</span>
        <span>途中から</span>
      </button>

      <small class="cover-copy"></small>
    </div>
  </section>

  <section id="player" class="screen player" hidden>
    <header>
      <button id="back" aria-label="表紙へ戻る">‹</button>
      <div>
        <small id="playerSeries">H(x)∞ origin</small>
        <strong id="playerEpisode">REPORT 01「Calm Down BUG」</strong>
      </div>
      <button id="sound" aria-label="BGM切替">♪</button>
    </header>

    <div id="stage">
      <div id="sceneBackground" aria-hidden="true">
        <div id="sceneBackgroundMotion">
          <div id="sceneBackgroundImage"></div>
        </div>
        <div id="sceneBackgroundTexture"></div>
      </div>
      <div id="scanlines" aria-hidden="true"></div>
      <div id="focusGuide" aria-hidden="true"></div>
      <div id="lines"></div>
      <div id="hint">TAP</div>
      <div id="gestureHint" hidden>スクロールではなく、タップで進みます。</div>
    </div>

    <footer>
      <span id="count">0 / 0</span>
      <div class="bar"><i id="bar"></i></div>
      <button id="mode">AUTO</button>
    </footer>
  </section>

  <section id="ending" class="screen ending" hidden>
    <div class="ending-card">
      <h2>LOG SAVED.</h2>
    </div>

    <div id="endingActions" class="ending-actions" hidden>
      <div class="episode-nav">
        <button id="previousEpisode" class="ending-nav-button" hidden>
          <span class="nav-kicker">PREVIOUS</span>
          <span class="nav-label">前の話</span>
        </button>

        <button id="episodes" class="ending-nav-button">
          <span class="nav-kicker">REPORTS</span>
          <span class="nav-label">報告書一覧</span>
        </button>

        <button id="nextEpisode" class="ending-nav-button" hidden>
          <span class="nav-kicker">NEXT</span>
          <span class="nav-label">続き</span>
        </button>
      </div>

      <button id="replay" class="replay-link">REOPEN</button>
    </div>
  </section>
</main>

<audio id="theme" loop preload="auto" playsinline></audio>
<audio id="ambience" loop preload="auto" playsinline></audio>
<audio id="effectAudio" preload="auto" playsinline></audio>
<script src="./series.js?v=3"></script>
<script>
(async function bootScenePlayer(){
  const manifest=window.SHINO_SERIES||{episodes:[]};
  window.SHINO_EPISODES=window.SHINO_EPISODES||{};

  function loadScript(src){
    return new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      script.src=src;
      script.onload=resolve;
      script.onerror=()=>reject(new Error("Episode load failed: "+src));
      document.head.appendChild(script);
    });
  }

  try{
    for(const episode of manifest.episodes||[]){
      await loadScript(episode.src);
    }

    const app=document.createElement("script");
    app.src="./script.js?v=3";
    document.body.appendChild(app);
  }catch(error){
    console.error(error);
    document.body.innerHTML=
      '<main style="padding:30px;font-family:sans-serif">Episode data could not be loaded.</main>';
  }
})();
</script>
</body>
</html>
