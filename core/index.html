<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf5">
  <title>Scene Player Core v1.3 Audio Demo</title>
  <link rel="stylesheet" href="./scene-player-core.css">
  <style>html,body,#player{margin:0;width:100%;height:100%;min-height:100dvh}</style>
</head>
<body>
  <div id="player"></div>
  <script src="./scene-player-core.js"></script>
  <script>
    fetch('./demo.scene.json')
      .then((r) => {
        if (!r.ok) throw new Error(`Failed to load demo.scene.json (${r.status})`);
        return r.json();
      })
      .then((doc) => {
        const player = new ScenePlayerCore('#player');
        player.load(doc);
        window.player = player;
      })
      .catch((error) => {
        document.querySelector('#player').innerHTML = '<pre style="padding:24px;white-space:pre-wrap">' + error.message + '\n\nローカルサーバー経由で開いてください。</pre>';
      });
  </script>
</body>
</html>
