<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <title>Easy Studio v0.2</title>
  <link rel="stylesheet" href="./scene-player-core.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="app">
  <section id="editorScreen" class="screen editor-screen">
    <header class="topbar">
      <div><p class="brand-kicker">SCENE STUDIO</p><h1>Easy Studio</h1></div>
      <span class="version">v0.2</span>
    </header>

    <section class="intro">
      <h2>文章を貼るだけ。</h2>
      <p>次の文章を、まだ見せない体験にします。</p>
    </section>

    <div class="form-stack">
      <label class="field">
        <span class="field-label">作品タイトル</span>
        <input id="titleInput" type="text" placeholder="例：声のそろう通り">
      </label>
      <label class="field">
        <span class="field-label">作者名 <small>任意</small></span>
        <input id="authorInput" type="text" placeholder="例：Yuya Narita">
      </label>
      <label class="field body-field">
        <span class="field-label">本文</span>
        <textarea id="bodyInput" placeholder="ここに文章を貼り付けてください。"></textarea>
        <div class="body-meta">
          <span id="charCount">0文字</span>
          <button id="sampleButton" class="text-button" type="button">サンプルを入れる</button>
        </div>
      </label>

      <section class="theme-section">
        <div class="section-heading"><span>雰囲気</span><small>あとから変えられます</small></div>
        <div class="theme-grid">
          <button class="theme-card is-selected" data-theme="light" type="button"><span class="theme-preview theme-preview-light">あ</span><strong>LIGHT</strong><small>文章・エッセイ</small></button>
          <button class="theme-card" data-theme="dark" type="button"><span class="theme-preview theme-preview-dark">あ</span><strong>DARK</strong><small>SF・ホラー</small></button>
          <button class="theme-card" data-theme="cinema" type="button"><span class="theme-preview theme-preview-cinema">あ</span><strong>CINEMA</strong><small>余白・映画的</small></button>
        </div>
      </section>

      <details class="split-options">
        <summary>シーン分割を調整</summary>
        <div class="split-panel">
          <label><span>1シーンの目安</span>
            <select id="densitySelect"><option value="short">短め</option><option value="normal" selected>標準</option><option value="long">長め</option></select>
          </label>
          <p>空行・会話文・箇条書き・改行を優先し、最後に句点と文字数で整えます。</p>
        </div>
      </details>

      <div id="cinemaBackgroundPanel" class="cinema-background-panel" hidden>
        <div class="cinema-background-copy"><strong>背景画像</strong><span>Scene Formatの背景としてPlayerへ渡します。</span></div>
        <div class="cinema-tone" role="radiogroup" aria-label="CINEMAの明るさ">
          <button class="cinema-tone-button is-selected" type="button" data-tone="dark" aria-pressed="true">暗く</button>
          <button class="cinema-tone-button" type="button" data-tone="light" aria-pressed="false">明るく</button>
        </div>
        <label class="cinema-background-button" for="cinemaBackgroundInput">画像を選ぶ</label>
        <input id="cinemaBackgroundInput" type="file" accept="image/*" hidden>
        <button id="cinemaBackgroundClear" class="cinema-background-clear" type="button" hidden>画像を外す</button>
        <div id="cinemaBackgroundPreview" class="cinema-background-preview" hidden></div>
      </div>

      <button id="makeButton" class="primary-button" type="button"><span>プレイヤーにする</span><small>Scene Format v1へ変換します</small></button>
      <p class="footer-note">Easy Studioは本文を作るだけ。再生は共通Scene Player Coreが担当します。</p>
    </div>
  </section>

  <section id="playerScreen" class="easy-core-screen" hidden>
    <div id="scenePlayer"></div>
    <button id="editReturnButton" class="easy-edit-return" type="button">編集に戻る</button>
  </section>
</main>
<script src="./scene-player-core.js"></script>
<script src="./japanese-splitter.js"></script>
<script src="./script.js"></script>
</body>
</html>
