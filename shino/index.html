<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ea">
  <title>貧乏メガネのシノ — SCENE PLAYER v0.5.3</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <section id="shelf" class="screen shelf">
    <div class="eyebrow">SHINO SCENE PLAYER</div>
    <h1 id="seriesTitle">貧乏メガネのシノ</h1>
    <p class="shelf-copy">文字だけで、景色が浮かぶ。</p>
    <div id="episodeList" class="episode-list"></div>
    <button id="continueButton" class="primary-button" hidden>つづきから</button>
    <small>一文ずつ、タップで進みます。</small>
  </section>

  <section id="cover" class="screen cover" hidden>
    <button id="coverBack" class="cover-back" aria-label="話数一覧へ"><span aria-hidden="true">←</span><span>話数一覧</span></button>
    <div class="eyebrow">SHINO SCENE PLAYER</div>
    <h1>貧乏メガネのシノ</h1>
    <p id="episodeNumber">第1話</p>
    <h2 id="episodeTitle">「タダの冷蔵庫」</h2>
    <button id="start" class="primary-button">はじめる</button>
    <button id="resumeFromCover" class="secondary-button" hidden>途中から</button>
    <small>文字だけで、景色が浮かぶ。</small>
  </section>

  <section id="player" class="screen player" hidden>
    <header>
      <button id="back" aria-label="表紙へ戻る">‹</button>
      <div>
        <small id="playerSeries">貧乏メガネのシノ</small>
        <strong id="playerEpisode">第1話「タダの冷蔵庫」</strong>
      </div>
      <button id="sound" aria-label="BGM切替">♪</button>
    </header>

    <div id="stage">
      <div id="paperPulse" aria-hidden="true"></div>
      <div id="focusGuide" aria-hidden="true"></div>
      <div id="lines"></div>
      <div id="hint">TAP</div>
      <div id="gestureHint" hidden>スクロールではなく、タップで進みます。</div>
    </div>

    <footer>
      <span id="count">0 / 0</span>
      <div class="bar"><i id="bar"></i></div>
      <button id="mode">AUTO</button>
    </footer>
  </section>

  <section id="ending" class="screen ending" hidden>
    <div class="ending-card">
      <h2>つづく</h2>
    </div>

    <div id="endingActions" class="ending-actions" hidden>
      <div class="episode-nav">
        <button id="previousEpisode" class="ending-nav-button" hidden>
          <span class="nav-kicker">PREVIOUS</span>
          <span class="nav-label">前の話</span>
        </button>

        <button id="episodes" class="ending-nav-button">
          <span class="nav-kicker">EPISODES</span>
          <span class="nav-label">話数一覧</span>
        </button>

        <button id="nextEpisode" class="ending-nav-button" hidden>
          <span class="nav-kicker">NEXT</span>
          <span class="nav-label">続き</span>
        </button>
      </div>

      <button id="replay" class="replay-link">もう一度読む</button>
    </div>
  </section>
</main>

<audio id="theme" loop preload="auto" playsinline></audio>
<audio id="ambience" loop preload="auto" playsinline></audio>
<script src="./series.js"></script>
<script src="./script.js"></script>
</body>
</html>
