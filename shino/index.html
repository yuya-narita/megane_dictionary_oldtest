<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" name="viewport"/>
<meta content="#f5f2ea" name="theme-color"/>
<title>貧乏メガネのシノ — SCENE PLAYER v0.7</title>
<link href="./style.css?v=8" rel="stylesheet"/>
</head>
<body>
<main>
<section class="screen shelf" id="shelf">
<div class="shelf-hero">
  <div class="eyebrow">A STORY BY YUYA NARITA</div>
  <img alt="貧乏メガネのシノ" class="series-logo" src="./shino_logo.svg"/>
  <p class="shelf-copy">貧乏は、景色を変える。</p>
</div>
<button class="primary-button shelf-continue" hidden="" id="continueButton">つづきから</button>
<div class="episode-list" id="episodeList"></div>
<small class="shelf-footer-copy">一文ずつ、タップで進みます。</small>
</section>
<section class="screen cover" hidden="" id="cover">
<button aria-label="話数一覧へ" class="cover-back" id="coverBack"><span aria-hidden="true">←</span><span>話数一覧</span></button>
<div class="eyebrow">SHINO SCENE PLAYER</div>
<img alt="貧乏メガネのシノ" class="series-logo" src="./shino_logo.svg"/>
<p id="episodeNumber">第1話</p>
<h2 id="episodeTitle">「タダの冷蔵庫」</h2>
<button class="primary-button" id="start">はじめる</button>
<button class="secondary-button" hidden="" id="resumeFromCover">途中から</button>
<small>文字だけで、景色が浮かぶ。</small>
</section>
<section class="screen player" hidden="" id="player">
<header>
<button aria-label="表紙へ戻る" id="back">‹</button>
<div>
<small id="playerSeries">貧乏メガネのシノ</small>
<strong id="playerEpisode">第1話「タダの冷蔵庫」</strong>
</div>
<button aria-label="BGM切替" id="sound">♪</button>
</header>
<div id="stage">
<div aria-hidden="true" id="paperPulse"></div>
<div aria-hidden="true" id="focusGuide"></div>
<div id="lines"></div>
<div id="hint">TAP</div>
<div hidden="" id="gestureHint">スクロールではなく、タップで進みます。</div>
</div>
<footer>
<span id="count">0 / 0</span>
<div class="bar"><i id="bar"></i></div>
<button id="mode">AUTO</button>
</footer>
</section>
<section class="screen ending" hidden="" id="ending">
<div class="ending-card">
<h2>つづく</h2>
</div>
<div class="ending-actions" hidden="" id="endingActions">
<div class="episode-nav">
<button class="ending-nav-button" hidden="" id="previousEpisode">
<span class="nav-kicker">PREVIOUS</span>
<span class="nav-label">前の話</span>
</button>
<button class="ending-nav-button" id="episodes">
<span class="nav-kicker">EPISODES</span>
<span class="nav-label">話数一覧</span>
</button>
<button class="ending-nav-button" hidden="" id="nextEpisode">
<span class="nav-kicker">NEXT</span>
<span class="nav-label">続き</span>
</button>
</div>
<button class="replay-link" id="replay">もう一度読む</button>
</div>
</section>
</main>
<audio id="theme" loop="" playsinline="" preload="auto"></audio>
<audio id="ambience" loop="" playsinline="" preload="auto"></audio>
<audio id="effectAudio" playsinline="" preload="auto"></audio>
<script src="./series.js?v=4"></script>
<script>
(async function bootScenePlayer(){
  const manifest=window.SHINO_SERIES||{episodes:[]};
  window.SHINO_EPISODES=window.SHINO_EPISODES||{};

  function loadScript(src){
    return new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      script.src=src;
      script.onload=resolve;
      script.onerror=()=>reject(new Error("Episode load failed: "+src));
      document.head.appendChild(script);
    });
  }

  try{
    for(const episode of manifest.episodes||[]){
      await loadScript(episode.src);
    }

    const app=document.createElement("script");
    app.src="./script.js?v=6";
    document.body.appendChild(app);
  }catch(error){
    console.error(error);
    document.body.innerHTML=
      '<main style="padding:30px;font-family:sans-serif">Episode data could not be loaded.</main>';
  }
})();
</script>
</body>
</html>
