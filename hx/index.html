<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>H(x)∞ origin｜世界バグ報告書</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <section id="archive" class="screen archive">
    <div class="archive-bg"></div>
    <div class="archive-overlay"></div>
    <header class="archive-header">
      <span>FUTURE DETERMINATION CONFLUENCE</span>
      <span>NIX-LOG</span>
    </header>

    <div class="archive-brand">
      <img id="archiveLogo" src="./images/logo.svg" alt="H(x)∞ logo">
      <h1>H(x)∞ origin</h1>
      <p>世界バグ報告書：NIX_LOG_∞</p>
    </div>

    <button id="resumeButton" class="resume-card" hidden>
      <span>RESUME LOG</span>
      <strong>観測を再開する</strong>
      <small id="resumeMeta"></small>
    </button>

    <div class="report-heading">WORLD BUG REPORTS</div>
    <div id="trackList" class="track-list"></div>
  </section>

  <section id="player" class="screen player" hidden>
    <header class="player-header">
      <button id="backButton" aria-label="一覧へ戻る">←</button>
      <div>
        <small id="playerSeries">H(x)∞ origin</small>
        <strong id="playerTitle">REPORT 01 / Calm Down BUG</strong>
      </div>
      <button id="soundButton" aria-label="音声切替">♪</button>
    </header>

    <div class="stage">
      <div class="stage-noise"></div>
      <div class="stage-scanlines"></div>

      <div class="report-meta">
        <span id="reportNumber">REPORT 01</span>
        <span id="reportState">ANALYSIS READY</span>
      </div>

      <img class="stage-logo" src="./images/logo.svg" alt="">
      <h2 id="trackTitle">Calm Down BUG</h2>
      <p id="trackSubtitle">世界バグ報告書</p>

      <div id="narration" class="narration">
        <div id="previousLine" class="previous-line"></div>
        <div id="currentLine" class="current-line">ACCESSING...</div>
      </div>
    </div>

    <footer class="player-footer">
      <span id="currentTime">00:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span id="duration">00:00</span>
      <button id="playPause">▶</button>
    </footer>
  </section>

  <section id="ending" class="screen ending" hidden>
    <img src="./images/logo.svg" alt="">
    <p>LOG SAVED.</p>
    <h2>観測終了。</h2>
    <div>
      <button id="nextTrack">NEXT REPORT</button>
      <button id="backArchive">ARCHIVE</button>
    </div>
  </section>
</main>

<audio id="music" preload="metadata"></audio>
<audio id="voice" preload="metadata"></audio>

<script src="./data/tracks.js"></script>
<script src="./script.js"></script>
</body>
</html>
